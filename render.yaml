# Despliegue en Render (plan gratuito). Render → New → Blueprint → elige este repositorio.
services:
  - type: web
    name: rodarent
    runtime: node
    plan: free
    region: ohio # misma zona que la base de Neon (AWS US East 2, Ohio)
    rootDir: web
    # Crea tablas, datos de ejemplo (si la base está vacía) y usuarios del panel; luego compila.
    buildCommand: npm ci && node scripts/setup-db.mjs && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NOMBRE
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-haiku-5-5
      - key: NEGOCIO_NOMBRE
        value: Alquiler de Vehículos BP
      - key: NEGOCIO_LEMA
        value: Todas las gamas
      - key: NEGOCIO_CIUDAD
        value: Cali
      - key: NEGOCIO_WHATSAPP
        sync: false
      - key: CRON_SECRET
        generateValue: true
      # WhatsApp Business: WHATSAPP_TOKEN, WHATSAPP_PHONE_NUMBER_ID, WHATSAPP_APP_SECRET y
      # WHATSAPP_VERIFY_TOKEN se configuran a mano en Render (en el servicio o en un Environment Group).
